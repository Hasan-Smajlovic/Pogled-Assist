version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /
    # Runtime/build package updates need a separate compatibility decision.
    allow:
      - dependency-name: basedpyright
      - dependency-name: import-linter
      - dependency-name: pytest*
      - dependency-name: PyYAML
      - dependency-name: ruff
      - dependency-name: tomli
      - dependency-name: zizmor
    # These releases dropped Python 3.10; keep compatible patch updates eligible.
    # Revisit the ranges when the project's supported Python version changes.
    ignore:
      - dependency-name: import-linter
        versions: [">=2.16"]
      - dependency-name: zizmor
        versions: [">=1.31"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: build(deps)
    groups:
      check-tools:
        patterns:
          - "*"
