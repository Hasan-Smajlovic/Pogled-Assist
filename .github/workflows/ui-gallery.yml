name: UI gallery

on:
  workflow_run:
    workflows:
      - CI
    types:
      - requested
      - in_progress
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_run' && github.event.action != 'completed' &&
        format('ui-gallery-status-{0}', github.event.workflow_run.head_branch) || 'ui-gallery-pages' }}
  cancel-in-progress: false

jobs:
  build:
    name: build-ui-gallery
    if: >-
      github.repository == 'Hasan-Smajlovic/Pogled-Assist' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'pull_request' && github.event.action == 'completed'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: read
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"

      - name: Read the configured Pages URL
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Build galleries from validated CI images
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python scripts/ui/prepare_ui_gallery_site.py build \
            --output "$RUNNER_TEMP/ui-gallery-site" \
            --comments "$RUNNER_TEMP/ui-gallery-comments/comments.json" \
            --base-url "$PAGES_BASE_URL"

      - name: Upload the Pages site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ runner.temp }}/ui-gallery-site

      - name: Upload the PR comment data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-gallery-comments
          path: ${{ runner.temp }}/ui-gallery-comments/comments.json
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: publish-ui-gallery
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the gallery site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  comment:
    name: comment-ui-gallery
    needs: [build, deploy]
    if: >-
      always() && github.repository == 'Hasan-Smajlovic/Pogled-Assist' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Check out the trusted workflow revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"

      - name: Download the trusted comment data from this workflow
        if: needs.deploy.result == 'success'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: ui-gallery-comments
          path: ${{ runner.temp }}/ui-gallery-comments

      - name: Update one bot comment per open pull request
        if: needs.deploy.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENTS_PATH: ${{ runner.temp }}/ui-gallery-comments/comments.json
        run: >-
          python scripts/ui/prepare_ui_gallery_site.py comment --comments "$COMMENTS_PATH"
          --publication-run-id "$GITHUB_RUN_ID"

      - name: Show progress while CI is queued or running
        if: github.event_name == 'workflow_run' && github.event.action != 'completed'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: >-
          python scripts/ui/prepare_ui_gallery_site.py status --publication preparing
          --publication-run-id "$GITHUB_RUN_ID" --ci-run-id "$CI_RUN_ID" --ci-attempt "$CI_ATTEMPT"

      - name: Report a failed gallery build or deployment
        if: >-
          (github.event_name == 'workflow_dispatch' || github.event.action == 'completed') &&
          (needs.build.result == 'failure' || needs.deploy.result == 'failure' ||
           needs.build.result == 'cancelled' || needs.deploy.result == 'cancelled')
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          arguments=(--publication failed --publication-run-id "$GITHUB_RUN_ID")
          if [[ -n "$CI_RUN_ID" ]]; then
            arguments+=(--ci-run-id "$CI_RUN_ID" --ci-attempt "$CI_ATTEMPT")
          fi
          python scripts/ui/prepare_ui_gallery_site.py status "${arguments[@]}"
