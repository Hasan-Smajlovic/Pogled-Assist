name: CI

on:
  pull_request:
    branches:
      - development
      - master
  # Only development pushes save the shared Python environment that pull requests restore.
  push:
    branches:
      - development
  workflow_dispatch:
  # Publish release reuses these jobs for the merged master commit.
  workflow_call:
    outputs:
      artifact_name:
        description: Name of the verified Windows package artifact uploaded by windows-package.
        value: ${{ jobs.windows-package.outputs.artifact_name }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check changed dependencies for known vulnerabilities
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          license-check: false
          show-openssf-scorecard: false

  code-quality:
    name: code-quality
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Restore the shared Python 3.10 environment
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.tool_cache }}/Python/3.10.*
          key: ${{ runner.os }}-${{ runner.arch }}-python-3.10-environment-v1-${{ hashFiles('requirements.txt', 'requirements-dev.txt', 'requirements-build.txt') }}

      - name: Set up Python 3.10
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"

      - name: Install check, test and build dependencies
        run: "python -m pip install --no-compile --only-binary=:all: -r requirements-dev.txt -r requirements-build.txt"

      - name: Check Python source, types, imports and workflow security
        env:
          STATIC_CHECK_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/development' }}
        run: python -B -m scripts.checks.static_checks

      - name: Cache pinned PowerShell and workflow tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .dev-tools/PSScriptAnalyzer
            .dev-tools/actionlint
          key: ${{ runner.os }}-${{ runner.arch }}-check-tools-${{ hashFiles('scripts/checks/install_powershell_analyzer.ps1', 'scripts/checks/check_github_actions.ps1') }}

      - name: Ensure PSScriptAnalyzer is available
        shell: powershell
        run: .\scripts\checks\install_powershell_analyzer.ps1

      - name: Check GitHub Actions workflows
        shell: powershell
        run: .\scripts\checks\check_github_actions.ps1 -Install

      - name: Check PowerShell source
        shell: powershell
        run: .\scripts\checks\check_powershell.ps1 -RequireAnalyzer

  tests:
    name: tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Restore the shared Python 3.10 environment
        id: python-environment
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.tool_cache }}/Python/3.10.*
          key: ${{ runner.os }}-${{ runner.arch }}-python-3.10-environment-v1-${{ hashFiles('requirements.txt', 'requirements-dev.txt', 'requirements-build.txt') }}

      - name: Set up Python 3.10
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"

      - name: Install check, test and build dependencies
        run: "python -m pip install --no-compile --only-binary=:all: -r requirements-dev.txt -r requirements-build.txt"

      # Save before any repository code runs, so the cache holds only the pinned installs.
      - name: Save the shared Python 3.10 environment from development
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/development' &&
          steps.python-environment.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.tool_cache }}/Python/3.10.*
          key: ${{ steps.python-environment.outputs.cache-primary-key }}

      - name: Run automated tests without Tobii hardware
        shell: powershell
        env:
          POGLED_ASSIST_UI_GALLERY: ${{ github.workspace }}/dist/ui-gallery
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -B -m pytest -p no:cacheprovider `
            -n 4 --dist=loadfile `
            -vv -o faulthandler_timeout=120 `
            --durations=30 `
            --cov=pogled_assist `
            --cov-report=term-missing:skip-covered `
            --cov-report=xml:coverage.xml

      - name: Upload UI review galleries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-gallery
          path: dist/ui-gallery
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  windows-package:
    name: windows-package
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      artifact_name: ${{ steps.build.outputs.artifact_name }}
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Restore the shared Python 3.10 environment
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.tool_cache }}/Python/3.10.*
          key: ${{ runner.os }}-${{ runner.arch }}-python-3.10-environment-v1-${{ hashFiles('requirements.txt', 'requirements-dev.txt', 'requirements-build.txt') }}

      - name: Set up Python 3.10
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"

      - name: Install check, test and build dependencies
        run: "python -m pip install --no-compile --only-binary=:all: -r requirements-dev.txt -r requirements-build.txt"

      - name: Build and smoke-test the Windows package
        id: build
        shell: powershell
        run: .\scripts\release\build_windows_package.ps1 -PythonPath python

      - name: Upload the verified Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: ${{ steps.build.outputs.artifact_path }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
