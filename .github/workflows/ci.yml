name: CI

on:
  pull_request:
    branches:
      - development
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check changed dependencies for known vulnerabilities
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          license-check: false
          show-openssf-scorecard: false

  code-quality:
    name: code-quality
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install check dependencies
        run: "python -m pip install --no-compile --only-binary=:all: -r requirements-dev.txt"

      - name: Check Python source, types, imports and workflow security
        run: python -B -m scripts.checks.static_checks

      - name: Cache pinned PowerShell and workflow tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .dev-tools/PSScriptAnalyzer
            .dev-tools/actionlint
          key: ${{ runner.os }}-${{ runner.arch }}-check-tools-${{ hashFiles('scripts/checks/install_powershell_analyzer.ps1', 'scripts/checks/check_github_actions.ps1') }}

      - name: Ensure PSScriptAnalyzer is available
        shell: powershell
        run: .\scripts\checks\install_powershell_analyzer.ps1

      - name: Check GitHub Actions workflows
        shell: powershell
        run: .\scripts\checks\check_github_actions.ps1 -Install

      - name: Check PowerShell source
        shell: powershell
        run: .\scripts\checks\check_powershell.ps1 -RequireAnalyzer

  tests:
    name: tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: "python -m pip install --no-compile --only-binary=:all: -r requirements-dev.txt"

      - name: Run automated tests without Tobii hardware
        shell: powershell
        env:
          POGLED_ASSIST_UI_GALLERY: ${{ github.workspace }}/dist/ui-gallery
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -B -m pytest -p no:cacheprovider `
            -vv -o faulthandler_timeout=120 `
            --durations=30 `
            --cov=pogled_assist `
            --cov-report=term-missing:skip-covered `
            --cov-report=xml:coverage.xml

      - name: Upload UI review galleries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-gallery
          path: dist/ui-gallery
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  windows-package:
    name: windows-package
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install pinned build dependencies
        run: "python -m pip install --no-compile --only-binary=:all: -r requirements-build.txt"

      - name: Build and smoke-test the Windows package
        id: build
        shell: powershell
        run: .\scripts\release\build_windows_package.ps1 -PythonPath python

      - name: Upload the verified Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: ${{ steps.build.outputs.artifact_path }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
