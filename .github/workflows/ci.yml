name: CI

on:
  pull_request:
    branches:
      - development
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: code-quality
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Ruff
        run: python -m pip install ruff==0.16.7

      - name: Download PSScriptAnalyzer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path .\.dev-tools -Force | Out-Null
          Save-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Path .\.dev-tools -Repository PSGallery -Force

      - name: Check GitHub Actions workflows
        shell: powershell
        run: .\scripts\check_github_actions.ps1 -Install

      - name: Check Python source
        run: python -m ruff check .

      - name: Check Python formatting
        run: python -m ruff format --check .

      - name: Compile Python source
        run: python -B -m compileall -q gaze_mouse scripts tests run_gaze_mouse.py

      - name: Check PowerShell source
        shell: powershell
        run: .\scripts\check_powershell.ps1 -RequireAnalyzer

  tests:
    name: tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: "python -m pip install --no-compile --only-binary=:all: -r requirements-dev.txt"

      - name: Run automated tests without Tobii hardware
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -B -m pytest -p no:cacheprovider `
            --cov=gaze_mouse `
            --cov-report=term-missing:skip-covered `
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  windows-package:
    name: windows-package
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install pinned build dependencies
        run: "python -m pip install --no-compile --only-binary=:all: -r requirements-build.txt"

      - name: Build and smoke-test the Windows package
        id: build
        shell: powershell
        run: .\scripts\build_windows_package.ps1 -PythonPath python

      - name: Upload the verified Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: ${{ steps.build.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14
