name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  release:
    name: release
    if: github.repository == 'Hasan-Smajlovic/TobiiEyeTrackerTool'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out the merged master commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-build.txt

      - name: Install verification and build dependencies
        run: "python -m pip install --no-compile --only-binary=:all: -r requirements-dev.txt -r requirements-build.txt"

      - name: Download PSScriptAnalyzer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path .\.dev-tools -Force | Out-Null
          Save-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Path .\.dev-tools -Repository PSGallery -Force

      - name: Check GitHub Actions workflows
        shell: powershell
        run: .\scripts\check_github_actions.ps1 -Install

      - name: Run code checks
        shell: powershell
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -B -m compileall -q gaze_mouse scripts tests run_gaze_mouse.py
          .\scripts\check_powershell.ps1 -RequireAnalyzer

      - name: Run automated tests without Tobii hardware
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -B -m pytest -p no:cacheprovider `
            --cov=gaze_mouse `
            --cov-report=term-missing:skip-covered `
            --cov-fail-under=60

      - name: Build and smoke-test the exact merged commit
        id: build
        shell: powershell
        run: .\scripts\build_windows_package.ps1 -PythonPath python

      - name: Publish one versioned release with checksum
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .\scripts\publish_github_release.ps1 `
            -ArtifactPath "${{ steps.build.outputs.artifact_path }}" `
            -Repository "${{ github.repository }}" `
            -CommitSha "${{ github.sha }}"
