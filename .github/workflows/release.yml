name: Publish release

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  # Runs the pull request checks and package build on the merged master commit, read-only.
  verify:
    name: verify-release
    if: github.event_name == 'push' && github.repository == 'Hasan-Smajlovic/Pogled-Assist'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: release
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the merged master commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}

      - name: Download the package verified in this run
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: ${{ runner.temp }}/release-package

      - name: Publish one versioned release with checksum
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_PATH: ${{ runner.temp }}/release-package/${{ needs.verify.outputs.artifact_name }}
        run: |
          .\scripts\release\publish_github_release.ps1 `
            -ArtifactPath $env:ARTIFACT_PATH `
            -Repository "${{ github.repository }}" `
            -CommitSha "${{ github.sha }}"
