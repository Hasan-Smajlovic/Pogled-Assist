name: Publish release

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  release:
    name: release
    if: github.event_name == 'push' && github.repository == 'Hasan-Smajlovic/Pogled-Assist'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out the merged master commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python 3.10
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-build.txt

      - name: Install verification and build dependencies
        run: "python -m pip install --no-compile --only-binary=:all: -r requirements-dev.txt -r requirements-build.txt"

      - name: Check Python source, types, imports and workflow security
        run: python -B -m scripts.checks.static_checks

      - name: Cache pinned PowerShell and workflow tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .dev-tools/PSScriptAnalyzer
            .dev-tools/actionlint
          key: ${{ runner.os }}-${{ runner.arch }}-check-tools-${{ hashFiles('scripts/checks/install_powershell_analyzer.ps1', 'scripts/checks/check_github_actions.ps1') }}

      - name: Ensure PSScriptAnalyzer is available
        shell: powershell
        run: .\scripts\checks\install_powershell_analyzer.ps1

      - name: Check GitHub Actions workflows
        shell: powershell
        run: .\scripts\checks\check_github_actions.ps1 -Install

      - name: Check PowerShell source
        shell: powershell
        run: .\scripts\checks\check_powershell.ps1 -RequireAnalyzer

      - name: Run automated tests without Tobii hardware
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -B -m pytest -p no:cacheprovider `
            -vv -o faulthandler_timeout=120 `
            --durations=30 `
            --cov=pogled_assist `
            --cov-report=term-missing:skip-covered

      - name: Build and smoke-test the exact merged commit
        id: build
        shell: powershell
        run: .\scripts\release\build_windows_package.ps1 -PythonPath python

      - name: Publish one versioned release with checksum
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .\scripts\release\publish_github_release.ps1 `
            -ArtifactPath "${{ steps.build.outputs.artifact_path }}" `
            -Repository "${{ github.repository }}" `
            -CommitSha "${{ github.sha }}"
