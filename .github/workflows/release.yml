name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: "New version without the v prefix, for example 0.2.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare-release-pr
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && github.repository == 'Hasan-Smajlovic/Pogled-Assist'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out master with release history
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Prepare a release branch from the latest master and development
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/release/prepare_release.py "$RELEASE_VERSION" --body-file "$RUNNER_TEMP/release-pr-body.md"

      - name: Open or show the draft release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          branch="release/v$RELEASE_VERSION"
          url=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base master --head "$branch" --json url --jq '.[0].url // empty')
          if [ -z "$url" ]; then
            url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base master --head "$branch" --draft --title "Release v$RELEASE_VERSION" --body-file "$RUNNER_TEMP/release-pr-body.md")
          fi
          echo "Draft release PR: $url" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: release
    if: github.event_name == 'push' && github.repository == 'Hasan-Smajlovic/Pogled-Assist'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out the merged master commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-build.txt

      - name: Install verification and build dependencies
        run: "python -m pip install --no-compile --only-binary=:all: -r requirements-dev.txt -r requirements-build.txt"

      - name: Download PSScriptAnalyzer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path .\.dev-tools -Force | Out-Null
          Save-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Path .\.dev-tools -Repository PSGallery -Force

      - name: Check GitHub Actions workflows
        shell: powershell
        run: .\scripts\checks\check_github_actions.ps1 -Install

      - name: Check Python source
        run: python -m ruff check .

      - name: Check Python formatting
        run: python -m ruff format --check .

      - name: Compile Python source
        run: python -B -m compileall -q pogled_assist scripts tests run_gaze_mouse.py

      - name: Check PowerShell source
        shell: powershell
        run: .\scripts\checks\check_powershell.ps1 -RequireAnalyzer

      - name: Run automated tests without Tobii hardware
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -B -m pytest -p no:cacheprovider `
            --cov=pogled_assist `
            --cov-report=term-missing:skip-covered

      - name: Build and smoke-test the exact merged commit
        id: build
        shell: powershell
        run: .\scripts\release\build_windows_package.ps1 -PythonPath python

      - name: Publish one versioned release with checksum
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .\scripts\release\publish_github_release.ps1 `
            -ArtifactPath "${{ steps.build.outputs.artifact_path }}" `
            -Repository "${{ github.repository }}" `
            -CommitSha "${{ github.sha }}"
